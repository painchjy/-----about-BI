# =============================================================================
# PoC 候选模型：智家商城·售后域（抽取自两份模拟语料，Extractor v1 契约）
# 语料：poc/corpus/智家商城售后服务业务白皮书.md（业务）
#       poc/corpus/售后中台系统现状与接口说明.md（技术）
# 说明：本文件由 LLM 按 agents/extractor.prompt.md 两遍法手工模拟执行产出，
#       用于验证本体覆盖度；全部元素 status=draft，证据为原文摘录。
# =============================================================================
model: {name: 智家售后域候选模型, udom: "0.1.1", status: draft}

elements:
  # ---- 证据（白皮书 ev-01~09 / 接口说明 ev-10~14）----
  - {id: ev-01, kind: Evidence, name: 白皮书-愿景使命,
     attrs: {kb: kb-aftersales, doc_title: 智家商城售后服务业务白皮书, doc_type: business, location: "§1",
             fragment: "我们的愿景是成为家电零售行业的售后服务标杆。售后团队的使命是：让每一次售后都简单、透明、可预期。"}}
  - {id: ev-02, kind: Evidence, name: 白皮书-指标表,
     attrs: {kb: kb-aftersales, doc_title: 智家商城售后服务业务白皮书, doc_type: business, location: "§2",
             fragment: "售后满意度 4.5→≥4.8（2026-Q3）；平均售后处理时长 52h→≤24h（2026-Q2）；一次解决率 71%→≥85%（2026-Q3）"}}
  - {id: ev-03, kind: Evidence, name: 白皮书-策略举措,
     attrs: {kb: kb-aftersales, doc_title: 智家商城售后服务业务白皮书, doc_type: business, location: "§3",
             fragment: "策略S1：售后全流程数字化与智能分流。举措：引入智能客服完成初判与分流；退款执行自动化；与物流商系统直连。"}}
  - {id: ev-04, kind: Evidence, name: 白皮书-政策规则,
     attrs: {kb: kb-aftersales, doc_title: 智家商城售后服务业务白皮书, doc_type: business, location: "§4",
             fragment: "政策P1：涉及资金退款的售后处置，必须保留人工复核通道。R1：七天无理由退货须未拆封且配件齐全；R2：单笔退款超2000元须售后主管审批。"}}
  - {id: ev-05, kind: Evidence, name: 白皮书-判定矩阵,
     attrs: {kb: kb-aftersales, doc_title: 智家商城售后服务业务白皮书, doc_type: business, location: "§4-R4",
             fragment: "R3：大家电安装完成后不支持七天无理由退货；R4：退换货判定按商品类型×使用情形矩阵执行。"}}
  - {id: ev-06, kind: Evidence, name: 白皮书-术语,
     attrs: {kb: kb-aftersales, doc_title: 智家商城售后服务业务白皮书, doc_type: business, location: "§5",
             fragment: "售后单：客户就一笔订单提出的退货、换货、维修诉求所形成的业务单据，是售后业务的核心载体。"}}
  - {id: ev-07, kind: Evidence, name: 白皮书-流程,
     attrs: {kb: kb-aftersales, doc_title: 智家商城售后服务业务白皮书, doc_type: business, location: "§6",
             fragment: "流程：客户提交申请→初审（现人工）→主管审核→取件或寄修→验收→退款或换货→关单回访。"}}
  - {id: ev-08, kind: Evidence, name: 白皮书-组织,
     attrs: {kb: kb-aftersales, doc_title: 智家商城售后服务业务白皮书, doc_type: business, location: "§7",
             fragment: "售后服务部：售后业务归口部门，下辖审核组与物流协同组。"}}
  - {id: ev-09, kind: Evidence, name: 白皮书-风险,
     attrs: {kb: kb-aftersales, doc_title: 智家商城售后服务业务白皮书, doc_type: business, location: "§8",
             fragment: "大促期间售后单量可达日常3-5倍，初审环节易积压，可能导致处理时长指标恶化。"}}
  - {id: ev-10, kind: Evidence, name: 接口说明-系统清单,
     attrs: {kb: kb-aftersales-sys, doc_title: 售后中台系统现状与接口说明, doc_type: technical, location: "§1",
             fragment: "ASS售后系统（自研遗留2015年Java单体）；OMS订单系统；WMS仓储系统；支付网关（外采SaaS）。"}}
  - {id: ev-11, kind: Evidence, name: 接口说明-接口表,
     attrs: {kb: kb-aftersales-sys, doc_title: 售后中台系统现状与接口说明, doc_type: technical, location: "§2",
             fragment: "createAfterSaleOrder(POST,非幂等)；queryAfterSaleStatus(GET,幂等)；approveRefund(POST,幂等)；executeRefund(POST,需幂等键)；arrangePickup(POST,非幂等)。"}}
  - {id: ev-12, kind: Evidence, name: 接口说明-数据表,
     attrs: {kb: kb-aftersales-sys, doc_title: 售后中台系统现状与接口说明, doc_type: technical, location: "§3",
             fragment: "as_order（售后单主表）：单号、订单号、类型（退/换/修）、状态、金额；refund_record（退款记录）：金额、审批人、幂等键。"}}
  - {id: ev-13, kind: Evidence, name: 接口说明-痛点,
     attrs: {kb: kb-aftersales-sys, doc_title: 售后中台系统现状与接口说明, doc_type: technical, location: "§4",
             fragment: "初审全靠人工平均每单4小时；createAfterSaleOrder不幂等，重复点击产生重复售后单需人工合并；审批通过后人工再操作退款平均延迟6小时。"}}
  - {id: ev-14, kind: Evidence, name: 接口说明-运行数据,
     attrs: {kb: kb-aftersales-sys, doc_title: 售后中台系统现状与接口说明, doc_type: technical, location: "§5",
             fragment: "日常售后单量约1200单/天；大促峰值5000+单/天。"}}

